<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clubs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F8;--surface:#fff;--ink:#101936;--muted:#5B6584;--line:#DDE2EF;--blue:#2F4BFF;--blue-ink:#fff;--danger:#D6304E;--shadow:0 1px 2px rgba(16,25,54,.06),0 8px 24px -12px rgba(16,25,54,.18)}
@media (prefers-color-scheme:dark){:root{--bg:#0C1226;--surface:#151D3A;--ink:#EEF1FF;--muted:#9AA5CC;--line:#26305A;--blue:#6C82FF;--blue-ink:#0C1226;--danger:#FF6B86;--shadow:0 8px 24px -12px rgba(0,0,0,.6)}}
*{box-sizing:border-box;margin:0}
body{font:16px/1.5 'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
h1,h2,h3,.brand{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;letter-spacing:-.02em}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header{background:var(--ink);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
@media (prefers-color-scheme:dark){header{background:#070B19}}
.brand{font-weight:800;font-size:1.5rem}
nav{display:flex;gap:4px;background:rgba(255,255,255,.1);padding:4px;border-radius:12px}
nav button{background:none;border:0;color:#cfd6f5;padding:8px 16px;border-radius:9px;cursor:pointer;font-weight:600}
nav button[aria-selected=true]{background:#fff;color:#101936}
.spacer{flex:1}
.status{display:flex;align-items:center;gap:8px;font-size:.875rem;color:#cfd6f5}
.dot{width:9px;height:9px;border-radius:50%;background:#7a83a8}
.dot.live{background:#2EE6A6}.dot.demo{background:#FFB547}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn.danger{color:var(--danger)}
header .btn{background:rgba(255,255,255,.12);color:#fff;border-color:transparent}
main{max-width:1080px;margin:0 auto;padding:32px 24px 64px}
.top{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
h1{font-size:clamp(2rem,5vw,3.25rem);line-height:1.05;font-weight:800}
.sub{color:var(--muted);margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.tile{height:112px;display:flex;align-items:flex-end;justify-content:space-between;padding:14px 18px;color:#fff;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-50px;top:-70px;background:rgba(255,255,255,.18)}
.tile::after{content:"";position:absolute;width:90px;height:90px;border-radius:24px;right:46px;bottom:-46px;background:rgba(255,255,255,.14);transform:rotate(20deg)}
.mono{font:800 3rem/1 'Bricolage Grotesque',sans-serif;position:relative;z-index:1}
.id{font-size:.8125rem;opacity:.85;position:relative;z-index:1}
.body{padding:16px 18px 8px;flex:1}
.body h3{font-size:1.25rem;margin-bottom:4px}
.body p{color:var(--muted);font-size:.9375rem}
.actions{display:flex;gap:8px;padding:12px 18px 18px}
.actions .btn{padding:6px 14px;font-size:.875rem}
.list{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 1.1rem 'Bricolage Grotesque',sans-serif;flex:none}
.row .name{font-weight:600;flex:1}
.row .meta{color:var(--muted);font-size:.875rem}
.empty{padding:48px 24px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:1.25rem;margin-bottom:6px}
dialog{border:0;border-radius:20px;padding:0;width:min(440px,92vw);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,15,40,.55)}
form{padding:24px;display:grid;gap:14px}
form h2{font-size:1.5rem}
label{display:grid;gap:6px;font-weight:600;font-size:.9375rem}
input,textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
.err{color:var(--danger);font-size:.9rem;min-height:1.2em}
.foot{display:flex;justify-content:flex-end;gap:8px}
.hint{color:var(--muted);font-size:.8125rem;font-weight:400}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:var(--danger)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <div class="brand">Clubs</div>
  <nav role="tablist">
    <button role="tab" id="t-clubs" aria-selected="true">Clubs</button>
    <button role="tab" id="t-users" aria-selected="false">Users</button>
  </nav>
  <div class="spacer"></div>
  <div class="status"><span class="dot" id="dot"></span><span id="stext">Not connected</span></div>
  <button class="btn" id="cfg">API settings</button>
  <button class="btn" id="auth">Log in</button>
</header>

<main>
  <div class="top">
    <div><h1 id="title">Clubs</h1><p class="sub" id="sub"></p></div>
    <button class="btn primary" id="add">New club</button>
  </div>
  <div id="view"></div>
</main>

<dialog id="dlg"><form id="frm" method="dialog"></form></dialog>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const state={tab:'clubs',base:'http://localhost:8080',token:null,demo:false,clubs:[],users:[]};
const COLORS=['#2F4BFF','#0E9F7A','#E5484D','#8E4EC6','#E57A00','#0A8FB3','#C2307E','#4B6B00'];
const colorOf=s=>COLORS[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- demo backend (used when the API is unreachable) ---------- */
const mock={clubs:[
 {id:1,name:'Chess club',description:'Weekly games, tournaments and opening study.'},
 {id:2,name:'Robotics club',description:'Build, program and compete with robots.'},
 {id:3,name:'Theatre club',description:'Rehearsals, improv nights and a spring play.'},
 {id:4,name:'Photography club',description:'Photo walks and darkroom sessions.'},
 {id:5,name:'Reading club',description:'One book a month, one long conversation.'}],
 users:[{id:1,nom:'admin'},{id:2,nom:'alice'},{id:3,nom:'bob'}],next:{clubs:6,users:4}};
function mockApi(method,path,body){
 const m=path.match(/^\/api\/(clubs|utilisateurs)(?:\/(\d+))?$/);
 if(path==='/api/auth/login')return{status:200,data:'demo-token'};
 if(path==='/api/auth/logout')return{status:200,data:''};
 if(!m)return{status:404};
 const key=m[1]==='clubs'?'clubs':'users',list=mock[key],id=m[2]&&+m[2],item=list.find(x=>x.id===id);
 if(method==='GET')return id?(item?{status:200,data:item}:{status:404}):{status:200,data:[...list]};
 if(method==='POST'){
  if(key==='users'&&list.some(u=>u.nom===body.nom))return{status:409};
  const o=key==='users'?{id:mock.next.users++,nom:body.nom}:{id:mock.next.clubs++,...body};list.push(o);return{status:201,data:o}}
 if(!item)return{status:404};
 if(method==='PUT'){Object.assign(item,key==='users'?{nom:body.nom}:body);return{status:200,data:item}}
 if(method==='DELETE'){list.splice(list.indexOf(item),1);return{status:204}}
}

/* ---------- API ---------- */
async function api(method,path,body){
 if(state.demo)return mockApi(method,path,body);
 const h={};if(body)h['Content-Type']='application/json';if(state.token)h.Authorization='Bearer '+state.token;
 const r=await fetch(state.base+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
 const t=await r.text();let data=t;try{data=JSON.parse(t)}catch{}
 return{status:r.status,data};
}
function setStatus(){
 $('#dot').className='dot '+(state.demo?'demo':state.live?'live':'');
 $('#stext').textContent=state.demo?'Demo data':state.live?'Connected to '+state.base.replace(/^https?:\/\//,''):'Not connected';
 $('#auth').textContent=state.token?'Log out':'Log in';
}
function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.className='show'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',2600)}
const messages={404:'That item no longer exists.',409:'That username is already taken.',400:'The server rejected the data. Check the fields and try again.',401:'Log in to do that.',403:'You do not have permission to do that.'};

/* ---------- load + render ---------- */
async function load(){
 try{
  const [c,u]=await Promise.all([api('GET','/api/clubs'),api('GET','/api/utilisateurs')]);
  if(c.status===401||u.status===401){state.live=true;state.clubs=[];state.users=[];setStatus();render();toast('Log in to load data.',true);return}
  state.clubs=Array.isArray(c.data)?c.data:[];state.users=Array.isArray(u.data)?u.data:[];state.live=!state.demo;
 }catch(e){
  state.live=false;state.clubs=[];state.users=[];setStatus();render();
  $('#view').innerHTML=`<div class="list"><div class="empty"><h3>Can't reach the API</h3><p>Check that it is running at ${esc(state.base)} and that CORS allows this page.<br>You can also explore the interface with sample data.</p><p style="margin-top:16px"><button class="btn primary" id="godemo">Use demo data</button> <button class="btn" id="retry">Try again</button></p></div></div>`;
  $('#godemo').onclick=()=>{state.demo=true;load()};$('#retry').onclick=load;return;
 }
 setStatus();render();
}
function render(){
 const clubs=state.tab==='clubs';
 $('#title').textContent=clubs?'Clubs':'Users';
 $('#add').textContent=clubs?'New club':'New user';
 const n=clubs?state.clubs.length:state.users.length;
 $('#sub').textContent=n+(clubs?(n===1?' club':' clubs'):(n===1?' user':' users'));
 $('#t-clubs').setAttribute('aria-selected',clubs);$('#t-users').setAttribute('aria-selected',!clubs);
 const v=$('#view');
 if(!n){v.innerHTML=`<div class="list"><div class="empty"><h3>No ${clubs?'clubs':'users'} yet</h3><p>Use “${clubs?'New club':'New user'}” to add the first one.</p></div></div>`;return}
 if(clubs){
  v.innerHTML='<div class="grid">'+state.clubs.map(c=>`<article class="card"><div class="tile" style="background:${colorOf(c.name)}"><span class="mono">${esc((c.name||'?')[0].toUpperCase())}</span><span class="id">#${c.id}</span></div><div class="body"><h3>${esc(c.name)}</h3><p>${esc(c.description||'No description yet.')}</p></div><div class="actions"><button class="btn" data-edit="${c.id}">Edit</button><button class="btn danger" data-del="${c.id}">Delete</button></div></article>`).join('')+'</div>';
 }else{
  v.innerHTML='<div class="list">'+state.users.map(u=>`<div class="row"><span class="avatar" style="background:${colorOf(u.nom)}">${esc((u.nom||'?')[0].toUpperCase())}</span><span class="name">${esc(u.nom)}</span><span class="meta">#${u.id}</span><button class="btn" data-edit="${u.id}">Rename</button><button class="btn danger" data-del="${u.id}">Delete</button></div>`).join('')+'</div>';
 }
}

/* ---------- dialogs ---------- */
const dlg=$('#dlg'),frm=$('#frm');
function open(html,onSubmit){
 frm.innerHTML=html;
 frm.onsubmit=async e=>{e.preventDefault();$('.err',frm).textContent='';
  try{const ok=await onSubmit(Object.fromEntries(new FormData(frm)));if(ok!==false)dlg.close()}
  catch(x){$('.err',frm).textContent='Could not reach the API.'}};
 const c=$('[data-close]',frm);if(c)c.onclick=()=>dlg.close();
 dlg.showModal();const f=frm.querySelector('input,textarea');if(f)f.focus();
}
const foot=(label)=>`<div class="err" role="alert"></div><div class="foot"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">${label}</button></div>`;
async function save(method,path,data,okMsg){
 const r=await api(method,path,data);
 if(r.status>=200&&r.status<300){toast(okMsg);await load();return true}
 $('.err',frm).textContent=messages[r.status]||'Something went wrong (status '+r.status+').';return false;
}
function clubForm(c){
 open(`<h2>${c?'Edit club':'New club'}</h2><label>Name<input name="name" required value="${esc(c?.name)}"></label><label>Description<textarea name="description">${esc(c?.description)}</textarea></label>${foot('Save club')}`,
  d=>save(c?'PUT':'POST','/api/clubs'+(c?'/'+c.id:''),d,c?'Club saved':'Club created'));
}
function userForm(u){
 open(`<h2>${u?'Rename user':'New user'}</h2><label>Username<input name="nom" required value="${esc(u?.nom)}"></label>${u?'':'<label>Password<input name="password" type="password" required></label>'}${foot(u?'Save user':'Create user')}`,
  d=>save(u?'PUT':'POST','/api/utilisateurs'+(u?'/'+u.id:''),d,u?'User saved':'User created'));
}
function confirmDel(label,path){
 open(`<h2>Delete ${esc(label)}?</h2><p class="hint" style="font-size:.95rem">This can't be undone.</p>${foot('Delete')}`,async()=>{
  const r=await api('DELETE',path);
  if(r.status===204||r.status===200){toast('Deleted');await load();return true}
  $('.err',frm).textContent=messages[r.status]||'Something went wrong (status '+r.status+').';return false});
 $('.primary',frm).classList.replace('primary','danger');$('.danger:last-child',frm).style.cssText='background:var(--danger);color:#fff;border-color:var(--danger)';
}
function loginForm(){
 open(`<h2>Log in</h2><label>Username<input name="username" required value=""></label><label>Password<input name="password" type="password" required value=""></label><p class="hint">Seeded accounts: admin, alice, bob.</p>${foot('Log in')}`,async d=>{
  const r=await api('POST','/api/auth/login',d);
  if(r.status===200&&typeof r.data==='string'){state.token=r.data;setStatus();toast('Logged in as '+d.username);load();return true}
  $('.err',frm).textContent='Wrong username or password.';return false});
}
function settingsForm(){
 open(`<h2>API settings</h2><label>Base URL<input name="base" required value="${esc(state.base)}"><span class="hint">Spring Boot must allow this origin with CORS.</span></label><label style="grid-auto-flow:column;justify-content:start;align-items:center;gap:10px"><input type="checkbox" name="demo" style="width:auto" ${state.demo?'checked':''}>Use demo data instead</label>${foot('Save and reload')}`,d=>{
  state.base=d.base.replace(/\/+$/,'');state.demo=!!d.demo;state.token=null;load()});
}

/* ---------- events ---------- */
$('#t-clubs').onclick=()=>{state.tab='clubs';render()};
$('#t-users').onclick=()=>{state.tab='users';render()};
$('#add').onclick=()=>state.tab==='clubs'?clubForm():userForm();
$('#cfg').onclick=settingsForm;
$('#auth').onclick=async()=>{
 if(state.token){try{await api('POST','/api/auth/logout')}catch{}state.token=null;setStatus();toast('Logged out')}else loginForm()};
$('#view').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const list=state.tab==='clubs'?state.clubs:state.users;
 if(b.dataset.edit){const it=list.find(x=>x.id==b.dataset.edit);state.tab==='clubs'?clubForm(it):userForm(it)}
 if(b.dataset.del){const it=list.find(x=>x.id==b.dataset.del);confirmDel(it.name||it.nom,'/api/'+(state.tab==='clubs'?'clubs':'utilisateurs')+'/'+it.id)}
});
setStatus();load();
</script>
</body>
</html>
